name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate changeset for runtime dependency updates
        # Dependabot PRs get no changeset, so runtime dependency bumps would never be released
        run: |
          base=$(git log -1 --format=%H --grep='^chore: version packages' HEAD)
          if [ -z "$base" ]; then echo "No previous release commit found; skipping"; exit 0; fi
          q='{d:(.dependencies//{}),o:(.optionalDependencies//{}),p:(.peerDependencies//{})}'
          pkgs=""
          for f in $(git ls-files '*package.json'); do
            case "$f" in *node_modules*) continue;; esac
            [ "$(jq -r '.private // false' "$f")" = "true" ] && continue
            name=$(jq -r '.name // empty' "$f"); [ -z "$name" ] && continue
            old=$(git show "$base:$f" 2>/dev/null | jq -S -c "$q" 2>/dev/null) || continue
            [ -z "$old" ] && continue
            new=$(jq -S -c "$q" "$f")
            [ "$old" != "$new" ] && pkgs="$pkgs $name"
          done
          echo "Release base: ${base:0:7}; packages with runtime dependency changes:${pkgs:- none}"
          if [ -n "$pkgs" ]; then
            { echo '---'; for p in $pkgs; do echo "\"$p\": patch"; done; echo '---'; echo; echo '- chore(deps): update runtime dependencies'; } > ".changeset/deps-runtime-$(date +%s).md"
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          github-token: ${{ secrets.RELEASE_TOKEN }}
          publish-script: pnpm changeset:publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Merge version PR after checks pass
        if: steps.changesets.outputs['has-changesets'] == 'true' && steps.changesets.outputs['pr-number'] != ''
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION_PR: ${{ steps.changesets.outputs['pr-number'] }}
        run: |
          version_branch=changeset-release/master
          status=$(gh pr view "$VERSION_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,state)
          [[ $(jq -r '.state' <<< "$status") != MERGED ]] || exit 0
          head=$(jq -er '.headRefOid' <<< "$status")

          while true; do
            status=$(gh pr view "$VERSION_PR" --repo "$GITHUB_REPOSITORY" \
              --json state,isDraft,isCrossRepository,baseRefName,headRefName,headRefOid,mergeable,mergeStateStatus,reviewDecision,statusCheckRollup)
            [[ $(jq -r '.state' <<< "$status") != MERGED ]] || exit 0
            jq -e --arg head "$head" --arg branch "$version_branch" '
              .state == "OPEN" and (.isDraft | not) and (.isCrossRepository | not)
              and .baseRefName == "master" and .headRefName == $branch and .headRefOid == $head
              and .reviewDecision != "CHANGES_REQUESTED" and .mergeable != "CONFLICTING"
            ' <<< "$status" > /dev/null || { echo "Version PR changed or needs review."; exit 1; }
            if jq -e 'any(.statusCheckRollup[];
              (.status == "COMPLETED" and (.conclusion | IN("SUCCESS", "SKIPPED", "NEUTRAL") | not))
              or (.state | IN("ERROR", "FAILURE")))' <<< "$status" > /dev/null; then
              echo "A version PR check failed or was cancelled."
              exit 1
            fi

            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --event pull_request \
              --branch "$version_branch" --commit "$head" --limit 100 --json workflowName,status,conclusion)
            if jq -e --argjson runs "$runs" '
              .mergeStateStatus == "CLEAN" and .reviewDecision != "REVIEW_REQUIRED"
              and (["CI", "CodeQL", "Security Audit"] | all(.[]; . as $workflow |
                any($runs[]; .workflowName == $workflow and .status == "completed" and .conclusion == "success")))
              and (.statusCheckRollup | length > 0 and all(.[]; .status == "COMPLETED" or .state == "SUCCESS"))
            ' <<< "$status" > /dev/null; then
              unresolved=$(gh api graphql --paginate -f query='
                query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $endCursor) {
                        nodes { id isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }' -f owner="$GITHUB_REPOSITORY_OWNER" -f repo="${GITHUB_REPOSITORY#*/}" -F number="$VERSION_PR" \
                --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not) | .id')
              [[ -z "$unresolved" ]] || { echo "The version PR has unresolved review threads."; exit 1; }
              master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
              [[ "$master" == "$GITHUB_SHA" ]] || { echo "Master moved while checks were running."; exit 1; }
              gh pr merge "$VERSION_PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$head"
              exit 0
            fi
            sleep 15
          done
